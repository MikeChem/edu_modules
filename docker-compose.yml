version: '3.8'

services:
  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://postgres:Mike_Lash007@db:5432/edu_modules
    depends_on:
      - db

  db:
    image: postgres:14
    environment:
      - POSTGRES_DB=edu_modules
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Mike_Lash007
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

volumes:
  postgres_data: